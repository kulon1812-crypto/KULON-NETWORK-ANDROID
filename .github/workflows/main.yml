
name: KULON NETWORK APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/kulon/network

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "KULON-NETWORK"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.kulon.network'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.kulon.network'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:theme="@android:style/Theme.Material.NoActionBar"
                  android:label="KULON NETWORK"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/kulon/network/MainActivity.java <<'EOF'
          package com.kulon.network;

          import android.app.Activity;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.view.Gravity;
          import android.widget.*;

          public class MainActivity extends Activity {

              int bg = Color.rgb(13, 13, 17);
              int red = Color.rgb(235, 45, 65);

              GradientDrawable shape(int color) {
                  GradientDrawable d = new GradientDrawable();
                  d.setColor(color);
                  d.setCornerRadius(18);
                  return d;
              }

              TextView text(String value, int size) {
                  TextView t = new TextView(this);
                  t.setText(value);
                  t.setTextColor(Color.WHITE);
                  t.setTextSize(size);
                  return t;
              }

              @Override
              public void onCreate(Bundle b) {
                  super.onCreate(b);

                  ScrollView scroll = new ScrollView(this);
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(1);
                  root.setPadding(24, 45, 24, 30);
                  root.setBackgroundColor(bg);
                  scroll.addView(root);

                  TextView logo = text("KULON", 34);
                  logo.setTypeface(null, Typeface.BOLD);
                  logo.setTextColor(red);
                  root.addView(logo);

                  TextView subtitle = text("NETWORK  /  ANDROID", 14);
                  subtitle.setTextColor(Color.LTGRAY);
                  root.addView(subtitle);

                  TextView line = text("━━━━━━━━━━━━━━━━━━", 16);
                  line.setTextColor(red);
                  root.addView(line);

                  TextView title = text("CONTROL PANEL", 23);
                  title.setTypeface(null, Typeface.BOLD);
                  title.setPadding(0, 28, 0, 8);
                  root.addView(title);

                  TextView info = text(
                      "Демонстрационный интерфейс KULON NETWORK",
                      13);
                  info.setTextColor(Color.GRAY);
                  root.addView(info);

                  addSwitch(root, "ESP DEMO", "Демонстрационный переключатель");
                  addSwitch(root, "AIM DEMO", "Только визуальная настройка");
                  addSwitch(root, "PRACTICE MODE", "Режим тестирования интерфейса");

                  Button settings = new Button(this);
                  settings.setText("SETTINGS");
                  settings.setTextColor(Color.WHITE);
                  settings.setBackground(shape(red));
                  LinearLayout.LayoutParams p =
                      new LinearLayout.LayoutParams(-1, 60);
                  p.topMargin = 25;
                  root.addView(settings, p);

                  TextView footer = text("KULON NETWORK  •  VERSION 1.0", 11);
                  footer.setGravity(Gravity.CENTER);
                  footer.setTextColor(Color.GRAY);
                  footer.setPadding(0, 35, 0, 0);
                  root.addView(footer);

                  setContentView(scroll);
              }

              void addSwitch(LinearLayout root, String name, String desc) {
                  LinearLayout card = new LinearLayout(this);
                  card.setOrientation(1);
                  card.setPadding(16, 14, 16, 14);
                  card.setBackground(shape(Color.rgb(29, 29, 37)));

                  TextView heading = text(name, 16);
                  heading.setTypeface(null, Typeface.BOLD);
                  card.addView(heading);

                  TextView description = text(desc, 12);
                  description.setTextColor(Color.GRAY);
                  card.addView(description);

                  Switch toggle = new Switch(this);
                  toggle.setText("Включить");
                  toggle.setTextColor(Color.WHITE);
                  card.addView(toggle);

                  LinearLayout.LayoutParams p =
                      new LinearLayout.LayoutParams(-1, -2);
                  p.topMargin = 16;
                  root.addView(card, p);
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KULON-NETWORK-APK
          path: app/build/outputs/apk/debug/app-debug.apk
